name: NU-ARB CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: arb_bot/requirements.txt
      - run: pip install -r arb_bot/requirements.txt
      - name: Offline engine self-test
        run: python arb_bot/run.py selftest
      - name: Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install
      - run: npm test
