name: Hybrid Core Tests and Acceptance Gates (final recovery pass)

on:
  push:
    branches:
      - main
      - hybrid-engine-multi-adapter
      - architecture/native-adapter-core
  pull_request:

jobs:
  hybrid-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r arb_bot/requirements.txt pytest pytest-asyncio httpx2
      - name: Compile hybrid core
        env:
          PYTHONPATH: arb_bot
        run: python -m compileall -q arb_bot
      - name: Run Python tests
        env:
          PYTHONPATH: arb_bot
        run: python -m pytest -q tests

  scanner-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run scanner tests
        run: node --test tests/scanner.test.js

  container-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build control-plane image
        run: docker build -f Dockerfile.control -t nu-arb-control:acceptance .
